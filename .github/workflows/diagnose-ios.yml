name: iOS diagnosis

# Reproduces the launch crash in CI instead of on someone's phone, and prints what is
# actually registered. ~16 minutes, no Apple account, no TestFlight round-trip.
#
# Two TestFlight builds died identically at launch:
#
#   EXC_BAD_ACCESS at 0x18 in
#   -[RCTComponentViewFactory createComponentViewWithComponentHandle:]
#
# which is what a Fabric component with no registered native class looks like in a
# Release build — the RCTAssert that would have named it is compiled out.
#
# Already ruled out: every Expo module is registered (ExpoModulesProvider lists
# ExpoUIModule, CalendarModule and the rest), autolinking resolves all five native
# packages with correct podspecs, and the app builds and links clean.
#
# Trigger: Actions > iOS diagnosis > Run workflow, or a [diagnose] commit marker.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

# NOT cancel-in-progress: GitHub evaluates concurrency before the job's `if:`, so a
# later push whose run is skipped still joins the group — and with cancellation on, it
# killed a diagnosis that was 12 minutes into a simulator build. A skipped run costs
# seconds, so queueing is free.
concurrency:
  group: diagnose-ios
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[diagnose]')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: npx pod-install

      # Compact on purpose: the component names are the answer, the file is noise.
      - name: Registered third-party Fabric components
        run: |
          F=$(find ios -name 'RCTThirdPartyComponentsProvider.mm' | head -1)
          if [ -z "$F" ]; then
            echo "RCTThirdPartyComponentsProvider.mm NOT GENERATED"
            echo "=> no third-party Fabric component is registered at all"
            exit 0
          fi
          echo "Found: $F"
          echo "--- registered components ---"
          grep -oE '@"[A-Za-z0-9_]+"' "$F" | tr -d '@"' | sort -u

      - name: Build for the simulator
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -5

      # The point of the whole job: does it survive launch, and if not, what does a
      # Debug build say? In Debug, RCTAssert is compiled in, so an unregistered Fabric
      # component names itself instead of segfaulting in the factory.
      #
      # No `timeout` here: macOS does not ship it (that is GNU coreutils' `gtimeout`),
      # and its absence previously made this step report a crash for an app it had
      # never actually launched.
      - name: Launch it in a simulator
        run: |
          set -eo pipefail
          APP=$(find ios/build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "App: $APP"

          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for r in d.values() for x in r if x['isAvailable']][0])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"

          # --console-pty streams the app's stdout/stderr and exits when it dies.
          # Backgrounded with a manual deadline so a healthy app does not hang the job.
          xcrun simctl launch --console-pty "$UDID" io.moox.LifeTime > launch.log 2>&1 &
          LPID=$!
          ALIVE=0
          for _ in $(seq 1 45); do
            sleep 1
            if ! kill -0 "$LPID" 2>/dev/null; then ALIVE=0; break; fi
            ALIVE=1
          done
          kill "$LPID" 2>/dev/null || true

          echo "--- app output ---"
          tail -80 launch.log || true
          echo "------------------"

          if [ "$ALIVE" = "1" ]; then
            echo "RESULT: still running after 45s — no launch crash"
          else
            echo "RESULT: the app exited — it crashed on launch"
          fi

      # The Debug assertion, if there was one, lands in the device log rather than on
      # the app's stdout.
      - name: Device log for the app
        if: always()
        run: |
          UDID=$(xcrun simctl list devices booted -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(([x['udid'] for r in d.values() for x in r] or [''])[0])")
          [ -n "$UDID" ] || { echo "no booted simulator"; exit 0; }
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'processImagePath CONTAINS "LifeTime"' 2>/dev/null \
            | grep -viE "^Timestamp|^Filtering|signpost" | tail -60 || echo "(empty)"

      - name: Crash report, if any
        if: always()
        run: |
          sleep 5
          for D in ~/Library/Logs/DiagnosticReports \
                   ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports; do
            for F in $D/LifeTime*.ips; do
              [ -e "$F" ] || continue
              echo "--- $F ---"
              python3 - "$F" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          _, _, body = raw.partition("\n")
          d = json.loads(body)
          print("exception:", d.get("exception"))
          print("termination:", d.get("termination"))
          images = d.get("usedImages", [])
          for t in d.get("threads", []):
              if not t.get("triggered"):
                  continue
              for f in t.get("frames", [])[:16]:
                  i = f.get("imageIndex", -1)
                  name = images[i].get("name", "?") if 0 <= i < len(images) else "?"
                  print(f"  {name:28} {f.get('symbol') or hex(f.get('imageOffset', 0))}")
          PY
              exit 0
            done
          done
          echo "no crash report found"

      - name: Keep everything on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnosis
          path: |
            ios/Podfile.lock
            ~/Library/Logs/DiagnosticReports/LifeTime*.ips
          if-no-files-found: ignore
          retention-days: 7
