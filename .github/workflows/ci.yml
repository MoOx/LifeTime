name: CI

on:
  # Every branch: this is the feedback loop while the rewrite lives outside main.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `npm run check` and not `tsc && jest`: the SDK-drift, route-tree and Hermes-Intl
      # guards each exist because something they now catch shipped to a device and
      # crashed it. Running the narrower pair here would let exactly those through.
      - run: npm run check

  # Catches config-plugin and native-config regressions without a macOS runner:
  # a broken app.json fails here rather than 20 minutes into a TestFlight build.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx expo export --platform ios --output-dir /tmp/export-ios
      - run: npx expo export --platform android --output-dir /tmp/export-android
