# Sub-flow: open one activity from Top Activities, give it a category, return to Summary.
# Env: ACTIVITY (its title), CATEGORY (a category id), SHOT ("1" to capture the screen).
appId: io.moox.LifeTime
---
- scrollUntilVisible:
    element:
      id: "TopActivities_${ACTIVITY}"
    direction: DOWN
    # Without this, a row under the translucent tab bar counts as visible and the tap hits
    # the tab bar.
    centerElement: true
- tapOn:
    id: "TopActivities_${ACTIVITY}"
- waitForAnimationToEnd
- tapOn:
    id: "ActivityOption_Category_${CATEGORY}"
- runFlow:
    when:
      true: ${SHOT == "1"}
    commands:
      - waitForAnimationToEnd
      - runFlow: _no-banner.yaml
      - takeScreenshot: ${OUT}/11-activity-options
# A real back navigation, as v1's Detox flow did: re-tapping the active tab returns the
# home to the current week, and the activities to categorise are on the previous one.
- tapOn: "Back"
- waitForAnimationToEnd
