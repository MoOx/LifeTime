# Fresh install, nothing granted yet: welcome, privacy, the calendar permission screen,
# the empty home, empty goals, the new-goal form, and the notification prompt that v1
# shows after the first goal. Mirrors v1's e2e/fresh.e2e.js.
appId: io.moox.LifeTime
---
- launchApp:
    clearState: true
    permissions:
      calendar: unset
      notifications: unset
- extendedWaitUntil:
    visible:
      id: "WelcomeContinue"
    timeout: 15000
# Staged entrances: pitch at 750 ms, bottom block at 1250 ms, each fading over 1200 ms.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/01-welcome

- tapOn: "About LifeTime & Privacy..."
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/02-privacy
# Dismiss the sheet by dragging it down.
- swipe:
    start: "50%, 15%"
    end: "50%, 95%"
- waitForAnimationToEnd

- tapOn:
    id: "WelcomeContinue"
- extendedWaitUntil:
    visible:
      id: "AllowCalendarsAccess"
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/03-calendar-permission

- tapOn:
    id: "AllowCalendarsAccess"
# The system prompt; its wording depends on the iOS version.
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
# A freshly erased simulator has no events, so v1 shows its "no events" box.
- takeScreenshot: ${OUT}/04-home-empty

- tapOn:
    id: "tabGoals"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/05-goals-empty

- tapOn:
    id: "Goals_Button_AddAGoal"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/06-goal-new

- tapOn:
    id: "GoalEdit_quickDuration_30"
- scrollUntilVisible:
    element:
      id: "GoalEdit_category_bullet_rest"
    direction: DOWN
- tapOn:
    id: "GoalEdit_category_bullet_rest"
- tapOn:
    id: "GoalNewModalScreen_Button_Add"
- extendedWaitUntil:
    visible:
      id: "NotificationsPermissionsPopin_Button_request"
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/07-notifications-prompt
