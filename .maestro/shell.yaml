# Slice 1: the shell. Three tabs, their large titles at rest and collapsed, pushed screens,
# the two sheets, and re-tapping a tab popping to its root.
# Screenshots land under ~/.maestro/tests/<run>/shell/takeScreenshot/; copy them to
# docs/slices/1/ as evidence, and open them: a passing flow proves navigation, not pictures.
appId: io.moox.LifeTime
---
- launchApp:
    clearState: true
# Welcome shows at every cold start until settings persist (slice 7).
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# Summary
- assertVisible: "Your LifeTime"
- takeScreenshot: summary-rest
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: summary-collapsed
# Since slice 2 the Summary lists real activities; centre one before tapping it.
- scrollUntilVisible:
    element:
      id: "activity-Sleep"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "activity-Sleep"
- extendedWaitUntil:
    visible:
      id: "activity"
    timeout: 10000
- assertVisible: "Sleep"
- takeScreenshot: summary-pushed
# Re-tapping the active tab pops to the root (30-screens.md).
- tapOn: "Summary"
- assertNotVisible:
    id: "activity"
- assertVisible:
    id: "summary"

# Goals and its sheet
- tapOn: "Goals"
- assertVisible:
    id: "goals"
- takeScreenshot: goals-rest
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: goals-collapsed
- tapOn: "New Goal"
- assertVisible:
    id: "goal"
- takeScreenshot: goal-sheet
- tapOn: "Cancel"
- assertNotVisible:
    id: "goal"

# Settings, its pushed screens and the Help sheet
- tapOn: "Settings"
- assertVisible:
    id: "settings"
- takeScreenshot: settings-rest
- tapOn:
    id: "row-notifications"
- assertVisible:
    id: "notifications"
- takeScreenshot: settings-pushed
- tapOn: "Back"
- tapOn:
    id: "row-help"
- assertVisible:
    id: "help"
- takeScreenshot: help-sheet
- tapOn: "Done"
- assertNotVisible:
    id: "help"
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: settings-collapsed
